\* Veritas Mesh -- TLC configuration for AttestationLifecycle.tla
\* Phase 1 draft. Two attestation instances (one honest Prover, one modeled
\* as adversarial) checked against two independent Verifiers.
\*
\* NOTE: run TLC with the -deadlock flag. Every attestation has a natural
\* terminal state (all Verifiers have recorded a verdict), which TLC's
\* default deadlock detection otherwise flags as an error -- it is not one;
\* see AttestationLifecycle_report.md.
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -config AttestationLifecycle.cfg AttestationLifecycle.tla

SPECIFICATION Spec

CONSTANTS
    Attestations = {a1, a2}
    Verifiers = {v1, v2}
    Malicious = {a2}

INVARIANT TypeOK
INVARIANT SoundnessLifecycle
INVARIANT MultiVerifierIndependence

PROPERTY EventuallyPublished
