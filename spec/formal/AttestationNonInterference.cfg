\* Veritas Mesh -- TLC configuration for AttestationNonInterference.tla
\* Phase 1 draft. Three attestation instances (one honest, one adversarial,
\* one honest-and-unsatisfied), two independent Verifiers. Witnesses and
\* their satisfaction mapping are fixed inside the .tla module itself
\* (four values, two per truth value) rather than as CONSTANTS here.
\*
\* NOTE: run TLC with the -deadlock flag, same reason as
\* AttestationLifecycle.cfg -- every attestation has a natural terminal
\* state once every Verifier has recorded a verdict.
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -config AttestationNonInterference.cfg AttestationNonInterference.tla

SPECIFICATION Spec

CONSTANTS
    Attestations = {a1, a2, a3}
    Verifiers = {v1, v2}
    Malicious = {a2}

INVARIANT TypeOK
INVARIANT SoundnessLifecycle
INVARIANT MultiVerifierIndependence
INVARIANT WitnessNonInterference

PROPERTY EventuallyPublished
