[package]
name = "veritas-sdk"
version = "0.1.0-alpha"
edition = "2021"
description = "Thin, ergonomic wrapper over veritas-core, published to crates.io as the Rust client SDK for Veritas Mesh."
license = "Apache-2.0"

[dependencies]
veritas-core = { path = "../../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
sha2 = "0.10"
