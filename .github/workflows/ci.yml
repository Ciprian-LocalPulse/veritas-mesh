name: CI

# Real test jobs per language, replacing the link-checker-only CI this repo
# had before. Every job below mirrors a command that was actually run and
# passed while building this scaffold -- see /STATUS.md for the exact
# versions pinned to work around sandbox/toolchain issues encountered
# during development (documented there so CI failures from environment
# drift are easy to diagnose against a known-good baseline).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (core/, sdk/rust/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test --workspace
        run: cargo test --workspace --verbose

  go-mesh:
    name: Go (mesh/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mesh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test ./... -v

  go-sdk:
    name: Go (sdk/go/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test ./... -v

  python:
    name: Python (sdk/python/, analysis/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sdk/python
        run: pip install -e "sdk/python[dev]"
      - name: Test sdk/python (includes cross-language vector checks)
        run: pytest sdk/python -v
      - name: Install analysis/ (depends on sdk/python being installed above)
        run: pip install --no-deps -e "analysis"
      - name: Install analysis/ dev deps
        run: pip install pytest
      - name: Test analysis/
        run: pytest analysis -v

  typescript:
    name: TypeScript (dashboard/, sdk/typescript/)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [dashboard, sdk/typescript]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx vitest run

  # Placeholder job, intentionally failing closed rather than silently
  # skipping: there is no proto lint/breaking-change job yet because CI
  # running `buf generate` needs registry credentials this repo doesn't
  # have configured. Wire this up when proto/ codegen is actually run in
  # CI (see proto/buf.gen.yaml's own STATUS note).
  proto-lint:
    name: proto lint (not yet configured)
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "proto/ has no buf lint/breaking job configured yet."
          echo "See proto/buf.gen.yaml for why generation hasn't been run in CI."
          exit 1
