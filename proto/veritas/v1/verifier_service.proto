syntax = "proto3";

package veritas.v1;

option go_package = "github.com/Ciprian-LocalPulse/veritas-mesh/mesh/gen/veritas/v1;veritasv1";

import "veritas/v1/attestation.proto";
import "veritas/v1/rule_module.proto";

// A verifier node's gRPC surface. mesh/README.md currently marks mesh/
// "not started" — no RPC here has a real handler yet. This file, together
// with rfcs/0004-verifier-api.md's behavioral contract (error semantics,
// independence requirements, auth posture), is the normative target a
// first mesh/ implementation must be written against, and what the
// dashboard client and every SDK will eventually be generated against.
service VerifierService {
  // Verify a single attestation. This is the multi-verifier-independence
  // entry point: any two independent implementations of this RPC, given
  // the same Attestation, must return the same VerifyResponse.valid — that
  // property is what core/tests/vectors/ is for.
  rpc Verify(VerifyRequest) returns (VerifyResponse);

  // Verify many attestations in one call (batched for gossip-relay nodes
  // that need to validate a backlog quickly).
  rpc VerifyBatch(VerifyBatchRequest) returns (VerifyBatchResponse);

  // Look up a rule module's published manifest so a verifier can confirm
  // which circuit/proof-system an attestation's rule_id maps to.
  rpc GetRuleModule(GetRuleModuleRequest) returns (GetRuleModuleResponse);

  // Streaming subscription to newly gossiped attestations for a given
  // rule_id — used by mesh/internal/gossip and the dashboard's live view.
  rpc SubscribeAttestations(SubscribeAttestationsRequest) returns (stream Attestation);
}

message VerifyBatchRequest {
  repeated Attestation attestations = 1;
}

message VerifyBatchResponse {
  repeated VerifyResponse results = 1; // same order as the request
}

message SubscribeAttestationsRequest {
  string rule_id = 1; // empty string = subscribe to all rule_ids
}
