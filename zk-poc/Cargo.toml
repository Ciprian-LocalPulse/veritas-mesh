[package]
name = "veritas-zk-poc"
version = "0.1.0-alpha"
edition = "2021"
description = "Proof-of-concept: a REAL Groth16 zero-knowledge circuit for the banking-basel-iii transaction-threshold rule, using arkworks. Not yet wired into core/'s Attestation pipeline -- see README.md in this directory for integration status."
license = "Apache-2.0"

[dependencies]
ark-ff = "0.4"
ark-ec = "0.4"
ark-std = "0.4"
ark-relations = "0.4"
ark-r1cs-std = "0.4"
ark-groth16 = "0.4"
ark-bn254 = "0.4"
ark-snark = "0.4"
ark-serialize = "0.4"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "1"
zeroize = "=1.7.0"
zeroize_derive = "=1.4.2"
rayon = "=1.10.0"
rayon-core = "=1.12.1"
ark-crypto-primitives = { version = "=0.4.0", features = ["crh", "r1cs"] }
sha2 = "0.10"
hex = "0.4.3"
