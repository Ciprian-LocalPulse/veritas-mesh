[package]
name = "veritas-core"
version = "0.1.0-alpha"
edition = "2021"
description = "Veritas Mesh proof engine (attestation, commitments, signatures). See STATUS.md: proof backends are architectural placeholders pending RFC-0002 acceptance."
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-big-array = "0.5"
sha2 = "0.10"
ed25519-dalek = { version = "=2.0.0", default-features = false, features = ["rand_core", "std"] }
base64ct = "=1.6.0"
zeroize = "=1.7.0"
rand = "0.8"
rand_core = "0.6"
thiserror = "1"
hex = "0.4"
veritas-zk-poc = { path = "../zk-poc" }
ark-bn254 = "0.4"
ark-groth16 = "0.4"
ark-serialize = "0.4"
ark-ff = "0.4"
# Same toolchain-compat pins as zk-poc/Cargo.toml (rustc 1.75, see that
# file's own "Toolchain notes" and root STATUS.md) -- ark-groth16 pulls in
# the same transitive rayon/zeroize chain here that it does there, so the
# same pins are needed or this crate fails to build for the same reason
# zk-poc/ originally did.
zeroize_derive = "=1.4.2"
rayon = "=1.10.0"
rayon-core = "=1.12.1"

# `benches/*.rs` here use a plain `fn main()` (see proof_generation.rs's own
# doc comment for why: no criterion, to keep the toolchain pin simple).
# Without `harness = false`, Cargo links the default libtest harness
# instead, which looks for `#[bench]` functions, finds none, and silently
# no-ops `fn main()` -- `cargo bench` reports "0 measured" and the
# benchmark never actually runs. This was true of every `[[bench]]` target
# added here before this fix; add `harness = false` to any new one too.
[[bench]]
name = "proof_generation"
harness = false

[[bench]]
name = "signature"
harness = false

[[bench]]
name = "groth16_bn254"
harness = false



